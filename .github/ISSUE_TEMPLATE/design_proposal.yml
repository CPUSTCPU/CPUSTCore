name: 设计提案
description: 提议功能、微架构优化或接口调整
title: "[Proposal] "
labels:
  - enhancement
body:
  - type: textarea
    id: motivation
    attributes:
      label: 背景与目标
      description: 当前限制是什么，提案希望改善什么？
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: 方案
      description: 说明模块边界、状态、时序、恢复协议和特殊情况。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 比较考虑过的其他实现及未采用原因。
  - type: textarea
    id: impact
    attributes:
      label: 预期影响
      description: 功能、IPC、面积、频率、验证和兼容性的预期变化。
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 验证计划
      description: 需要增加哪些测试，如何测量性能与时序？
    validations:
      required: true
